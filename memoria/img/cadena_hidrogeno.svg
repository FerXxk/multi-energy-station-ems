    <text x="453" y="60">H₂</text>
    <text x="688" y="60">600 bar</text>
    <text x="923" y="60">repostaje</text>
  </g>

  <g fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3">
    <line x1="337" y1="110" x2="337" y2="140"/>
    <line x1="807" y1="110" x2="807" y2="140"/>
    <rect x="232" y="140" width="211" height="104" rx="4"/>
