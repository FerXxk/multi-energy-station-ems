  <g stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#fl)">
    <line x1="190" y1="68" x2="246" y2="68"/>
    <line x1="425" y1="68" x2="481" y2="68"/>
    <line x1="660" y1="68" x2="716" y2="68"/>
    <line x1="895" y1="68" x2="951" y2="68"/>
