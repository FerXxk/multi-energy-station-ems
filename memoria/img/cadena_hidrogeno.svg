<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 262" width="1150" height="262" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g fill="none" stroke="#1a1a1a" stroke-width="1.6">
    <rect x="15"  y="26" width="175" height="84" rx="4"/>
